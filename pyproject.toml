# ==============================================================================
# Smart Contract Dev Pipeline 2.0 - Python Project Configuration
# ==============================================================================
# Fichier: pyproject.toml
# Description: Configuration du projet Python (Poetry/Black/isort).
# ==============================================================================

[tool.poetry]
name = "smart-contract-dev-pipeline"
version = "2.0.0"
description = "Smart Contract Dev Pipeline 2.0 - Automated smart contract development"
authors = ["Dev Team <dev@pipeline.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/org/smart-contract-pipeline"
repository = "https://github.com/org/smart-contract-pipeline"
documentation = "https://docs.pipeline.io"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
alembic = "^1.12.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
redis = "^5.0.0"
httpx = "^0.25.0"
chromadb = "^0.4.0"
slither-analyzer = "^0.11.0"
halmos = "^0.3.0"
pyyaml = "^6.0.0"
gitpython = "^3.1.0"
click = "^8.1.0"
typing-extensions = "^4.8.0"
python-dateutil = "^2.8.0"
colorlog = "^6.7.0"
prometheus-client = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.11.0"
isort = "^5.12.0"
mypy = "^1.6.0"
ruff = "^0.1.0"

[tool.poetry.scripts]
pipeline = "src.cli.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | lib
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
omit = ["src/db/migrations/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]